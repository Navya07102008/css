<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 100%;
            height: 100vh;
            background-color: bisque;
        }
        .block1{
            width: 100%;
            height: 30vh;
            background-color: black;
            display: flex;
        }
        .block1 .box1{
            width: 30%;
            height: 30vh;
            background-color: aqua;
        }
        .block1 .box2{
            width: 35%;
            height: 30vh;
            background-color: blueviolet;
        }
        .block1 .box3{
            width: 35%;
            height: 30vh;
            background-color: cadetblue;
        }
        .block2{
            width: 100%;
            height: 35vh;
            background-color: blue;
            display: flex;

        }
        .block2 .box4{
            width: 50%;
            height: 35vh;
            background-color: chartreuse;
        }
        .block2 .box5{
            width: 25%;
            height: 35vh;
            background-color: coral;
        }
        .block2 .box5 .part1{
            width: 100%;
            height: 17vh;
            background-color: darkslategrey;
        }
        .block2 .box5 .part2{
            width: 100%;
            height: 18vh;
            background-color: darkslateblue;
        }
        .block2 .box6{
            width: 25%;
            height: 35vh;
            background-color: black;

        }
        .block2 .box6 .part1{
            width: 100%;
            height: 18vh;
            background-color: black;
        }
        .block2 .box6 .part2{
            width: 100%;
            height: 17vh;
            background-color: hotpink;
        }
        .block3{
            width: 100%;
            height: 100vh;
            background-color: olive;
            display: flex;
        }
        .block3 .box7{
             width: 40%;
             height: 35vh;
             background-color: darkred;
        }
        .block3 .box7 .part1{
            width: 100%;
            height:12vh;
            background-color: silver;
        }
        .block3 .box7 .part2{
            width: 100%;
            height: 12vh;
            background-color: darkgoldenrod;
        }
        .block3 .box7 .part3{
            width: 100%;
            height: 11vh;
            background-color: mediumturquoise;
        }
        .block3 .box8{
            width: 60%;
            height: 35vh;
            background-color: deeppink;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="block1">
            <div class="box1"></div>
            <div class="box2"></div>
            <div class="box3"></div>
        </div>
        <div class="block2">
            <div class="box4"></div>
            <div class="box5">
                <div class="part1">1</div>
                <div class="part2">2</div>
            </div>    
            <div class="box6">
                <div class="part1">1</div>
                <div class="part2">2</div>
            </div>
        </div>
        <div class="block3">
            <div class="box7">
                <div class="part1"></div>
                <div class="part2"></div>
                <div class="part3"></div>
            </div>
            <div class="box8"></div>
        </div>
    </div>
    
</body>
</html>
