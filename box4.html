<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        width: 100%;
        height: 100vh;
        background-color: cadetblue;
    }
    .block1{
        width: 100%;
        height: 30vh;
        background-color: bisque;
        display: flex;
    }
    .block1 .box1{
        width: 33%;
        height: 30vh;
        background-color: blueviolet;
    }
    .block1 .box2{
        width: 34%;
        height: 30vh;
        background-color: coral;
    }
    .block1 .box3{
        width: 34%;
        height: 30vh;
        background-color: darkmagenta;
    }
    .block2{
        width: 100%;
        height: 45vh;
        background-color: aqua;
    }
    .block3{
        width: 100%;
        height: 25vh;
        background-color: lawngreen;
        display: flex;
    }
    .block3 .box4{
        width: 33%;
        height: 25vh;
        background-color: navy;
    }
    .block3 .box5{
        width: 33%;
        height: 25vh;
        background-color: lightgreen;
   
    }
    .block3 .box6{
        width: 33%;
        height: 25vh;
        background-color: aqua;
        
   
    }
    .block3 .box6 .part1{
        width: 100%;
        height: 8vh;
        background-color: lightcoral;

    }
    .block3 .box6 .part2{
        width: 100%;
        height: 8vh;
        background-color: darksalmon;
    }
    .block3 .box6 .part3{
        width: 100%;
        height: 9vh;
        background-color: purple;
    }

</style>
<body>
    <div class="container">
          <div class="block1">
                <div class="box1">1</div>
                <div class="box2">2</div>
                <div class="box3">3</div>
          </div>
          <div class="block2">2</div>
          <div class="block3">
              <div class="box4"></div>
              <div class="box5"></div>
              <div class="box6">
                  <div class="part1"></div>
                  <div class="part2"></div>
                  <div class="part3"></div>
              </div>
          </div>
    </div>
    
</body>
</html>
